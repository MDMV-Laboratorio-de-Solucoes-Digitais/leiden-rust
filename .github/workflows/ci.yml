name: CI

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-and-test:
    name: Code Rigor & Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Rustfmt Check
        run: cargo fmt --check

      - name: Clippy Workspace Check
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Unit & Integration Tests (Debug)
        run: cargo nextest run --workspace

      - name: Release Tests (Performance SC-001 & Determinism)
        run: cargo nextest run --workspace --release

      - name: Documentation Build
        run: cargo doc --workspace --no-deps

      - name: Install cargo-deny
        uses: taiki-e/install-action@cargo-deny

      - name: Cargo Deny Check
        run: cargo deny --config deny.toml check
