name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            use_cross: true
            archive_ext: tar.gz
            bin_ext: ""
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            use_cross: true
            archive_ext: tar.gz
            bin_ext: ""
          - os: macos-14
            target: aarch64-apple-darwin
            use_cross: false
            archive_ext: tar.gz
            bin_ext: ""
          - os: macos-13
            target: x86_64-apple-darwin
            use_cross: false
            archive_ext: tar.gz
            bin_ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
            archive_ext: zip
            bin_ext: .exe

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.target }}

      - name: Setup rust-cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build release binary (cross)
        if: matrix.use_cross
        run: |
          cross build -p leiden-cli -p leiden-tui --release --target ${{ matrix.target }}

      - name: Build release binary (native)
        if: ${{ !matrix.use_cross }}
        run: |
          cargo build -p leiden-cli -p leiden-tui --release --target ${{ matrix.target }}

      - name: Strip debug symbols (Unix)
        if: runner.os != 'Windows'
        run: |
          strip target/${{ matrix.target }}/release/leiden-cli
          strip target/${{ matrix.target }}/release/leiden-tui

      - name: Package archive (Unix tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PKG_NAME="leiden-${TAG}-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}"
          cp target/${{ matrix.target }}/release/leiden-cli "dist/${PKG_NAME}/"
          cp target/${{ matrix.target }}/release/leiden-tui "dist/${PKG_NAME}/"
          cp README.md "dist/${PKG_NAME}/" 2>/dev/null || true
          cp LICENSE "dist/${PKG_NAME}/" 2>/dev/null || true
          cd dist
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          cd ..
          echo "PKG_NAME=${PKG_NAME}" >> "$GITHUB_ENV"
          echo "ARCHIVE_PATH=dist/${PKG_NAME}.tar.gz" >> "$GITHUB_ENV"

      - name: Package archive (Windows zip)
        if: matrix.archive_ext == 'zip'
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF -replace 'refs/tags/', ''
          $pkgName = "leiden-${tag}-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$pkgName"
          Copy-Item "target/${{ matrix.target }}/release/leiden-cli.exe" "dist/$pkgName/"
          Copy-Item "target/${{ matrix.target }}/release/leiden-tui.exe" "dist/$pkgName/"
          if (Test-Path "README.md") { Copy-Item "README.md" "dist/$pkgName/" }
          if (Test-Path "LICENSE") { Copy-Item "LICENSE" "dist/$pkgName/" }
          Set-Location dist
          Compress-Archive -Path $pkgName -DestinationPath "${pkgName}.zip" -Force
          Set-Location ..
          echo "PKG_NAME=$pkgName" >> $env:GITHUB_ENV
          echo "ARCHIVE_PATH=dist/${pkgName}.zip" >> $env:GITHUB_ENV

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          cd dist
          if [[ "${{ runner.os }}" == "Linux" || "${{ runner.os }}" == "macOS" ]]; then
            sha256sum "${PKG_NAME}.${{ matrix.archive_ext }}" > "${PKG_NAME}.${{ matrix.archive_ext }}.sha256"
          else
            certutil -hashfile "${PKG_NAME}.${{ matrix.archive_ext }}" SHA256 | findstr /v "hash" > "${PKG_NAME}.${{ matrix.archive_ext }}.sha256"
          fi
          cd ..

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PKG_NAME }}
          path: |
            ${{ env.ARCHIVE_PATH }}
            ${{ env.ARCHIVE_PATH }}.sha256

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: leiden-v*

      - name: Aggregate SHA-256 checksums
        run: |
          find release-assets -name "*.sha256" -exec cat {} \; > release-assets/SHA256SUMS.txt
          cat release-assets/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/**/*.tar.gz
            release-assets/**/*.zip
            release-assets/SHA256SUMS.txt
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
