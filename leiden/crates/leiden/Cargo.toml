[package]
name = "leiden"
version = "0.1.0"
description = "Panic-free, fully-documented Rust implementation of the Leiden algorithm for community detection on graphs."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
thiserror = "2.0.3"
tracing = "0.1.41"

[dev-dependencies]
criterion = { version = "0.8.0", default-features = false, features = ["cargo_bench_support"] }
proptest = "1.6.0"
tracing-subscriber = { version = "0.3.20", default-features = false }
tracing-test = { version = "0.2.5", default-features = false }

