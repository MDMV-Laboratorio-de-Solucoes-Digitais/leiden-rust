[package]
name = "leiden-tui"
version = "0.1.0"
description = "Interactive Terminal UI for inspecting Leiden partitions."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "leiden-tui"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.41", default-features = false, features = ["derive", "std", "help", "usage"] }
color-eyre = "0.6.3"
crossterm = "0.29.0"
leiden = { version = "=0.1.0", path = "../leiden" }
leiden-cli = { version = "=0.1.0", path = "../leiden-cli" }
ratatui = "0.30.2"
signal-hook = "0.3.17"
thiserror = "2.0.3"
tracing = { version = "0.1.41", default-features = false, features = ["std", "release_max_level_warn"] }
tracing-subscriber = { version = "0.3.20", default-features = false, features = ["fmt", "env-filter", "std"] }

[dev-dependencies]
insta = { version = "1.42.2" }
tracing-test = { version = "0.2.5", default-features = false }